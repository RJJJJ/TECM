name: Release validation

on:
  pull_request:
  push:
    branches:
      - main
      - feature/ios-parent-app-push-sync

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify checkout provenance
        run: bash scripts/testing/verify-ci-checkout.sh
      - name: Verify migrations, repeatable seed, RLS, and SQL suites
        shell: pwsh
        run: ./scripts/testing/database-verify.ps1

  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify checkout provenance
        working-directory: .
        run: bash scripts/testing/verify-ci-checkout.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm ls next sharp
      - run: npm run security:image-guard
      - run: npm run test:sharp
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checkout provenance
        run: bash scripts/testing/verify-ci-checkout.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: node scripts/testing/validate-n8n.mjs
      - run: node scripts/testing/repository-security-scan.mjs
      - run: deno check supabase/functions/send-apns/index.ts

  admin-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify checkout provenance
        run: bash scripts/testing/verify-ci-checkout.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase and reset schema
        run: |
          supabase start
          supabase db reset
          KONG_CONTAINER="$(docker ps --filter name=supabase_kong_ --format '{{.Names}}' | head -n 1)"
          test -n "$KONG_CONTAINER"
          docker restart "$KONG_CONTAINER" >/dev/null
          API_URL="$(supabase status -o json | jq -r .API_URL)"
          ANON_KEY="$(supabase status -o json | jq -r .ANON_KEY)"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --header "apikey: $ANON_KEY" "$API_URL/auth/v1/health" >/dev/null; then
              break
            fi
            test "$attempt" -lt 20
            sleep 2
          done
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"
      - name: Install Admin Web and Chromium
        working-directory: admin-web
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Run live Playwright flows
        working-directory: admin-web
        env:
          PLAYWRIGHT_ADMIN_EMAIL: admin@tecm.local
          PLAYWRIGHT_ADMIN_PASSWORD: LocalDemoOnly-1234
        run: npm run test:e2e

  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify checkout provenance
        run: bash scripts/testing/verify-ci-checkout.sh
      - name: Create an Xcode 16.4 simulator
        id: simulator
        shell: bash
        run: |
          simulator_id=$(xcrun simctl create \
            'TECM iPhone 16 Pro' \
            'com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro' \
            'com.apple.CoreSimulator.SimRuntime.iOS-18-5')
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project TECM.xcodeproj
      - name: Build without signing
        run: >-
          xcodebuild build
          -project TECM.xcodeproj
          -scheme TECM
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          CODE_SIGNING_ALLOWED=NO
      - name: Run Swift tests when a test target exists
        run: >-
          xcodebuild test
          -project TECM.xcodeproj
          -scheme TECM
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          -resultBundlePath '${{ runner.temp }}/TECMTests.xcresult'
      - name: Print XCTest bootstrap diagnostics
        if: failure()
        shell: bash
        run: |
          result_bundle='${{ runner.temp }}/TECMTests.xcresult'
          if [[ -d "$result_bundle" ]]; then
            xcrun xcresulttool get test-results summary --path "$result_bundle" || true
            xcrun xcresulttool get log --path "$result_bundle" --type console || true
          fi
          simulator_id='${{ steps.simulator.outputs.id }}'
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b || true
          xcrun simctl spawn "$simulator_id" log show \
            --last 15m \
            --style compact \
            --predicate 'process == "TECM" OR process == "TECMTests"' \
            | tail -n 600 || true
          find "$HOME/Library/Logs/DiagnosticReports" \
            "$HOME/Library/Developer/CoreSimulator/Devices/$simulator_id/data/Library/Logs/CrashReporter" \
            -type f \( -name 'TECM*.crash' -o -name 'TECM*.ips' \) \
            -print -exec tail -n 400 {} \; 2>/dev/null || true
      - name: Remove the CI simulator
        if: always()
        shell: bash
        run: |
          simulator_id='${{ steps.simulator.outputs.id }}'
          if [[ -n "$simulator_id" ]]; then
            xcrun simctl shutdown "$simulator_id" || true
            xcrun simctl delete "$simulator_id" || true
          fi
